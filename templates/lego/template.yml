stroke:
  roughness: 1.2
  strokeWidth: 2
  bowing: 1
  color: "#1e1e1e"

font:
  size: 20
  lineHeight: 1.25
  charWidth: 0.62

wrap: 14
angle: 1.5
padding: { min: 0.5, max: 1.0 }
actorSize: 96        # sprites carry more detail than a stroked icon, so draw them larger

density:
  tight:  { clusterGap: 16, turnGap: 10 }
  medium: { clusterGap: 26, turnGap: 14 }
  loose:  { clusterGap: 40, turnGap: 20 }
